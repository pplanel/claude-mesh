[package]
name = "claude-mesh"
version = "0.1.0"
edition = "2024"
description = "Keep Claude Code's state (sessions, memory, plans, history) in sync across Macs over airshell"
license = "MIT"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
